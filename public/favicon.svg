<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background linear gradient: Discord Blurple to Deep Studio Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="42%" stop-color="#4350E0" />
      <stop offset="100%" stop-color="#192538" />
    </linearGradient>

    <!-- Top glass reflection highlight -->
    <linearGradient id="topGleam" x1="20%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Outer rim light border -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#66A3BF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.6" />
    </linearGradient>

    <!-- Clyde mascot fill gradient: crisp pure white down to platinum -->
    <linearGradient id="clydeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8EEF5" />
    </linearGradient>

    <!-- Creator sparkle: electric mint to holographic cyan to white -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#58E1FF" />
      <stop offset="100%" stop-color="#57F287" />
    </linearGradient>

    <!-- Drop shadow for the Clyde mascot -->
    <filter id="clydeShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.5" />
    </filter>

    <!-- Radiant soft bloom for the creator sparkle -->
    <filter id="starGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" />

  <!-- Studio Framing / Safe Zone Corner Reticles -->
  <path d="M16 26 V18 H26" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M16 102 V110 H26" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M102 110 H112 V102" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Centered Discord Clyde Mascot -->
  <g transform="translate(25.5, 45) scale(0.603)" filter="url(#clydeShadow)">
    <path fill="url(#clydeGrad)" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49.89,6.83,72.37,72.37,0,0,0,46.53,0,105.15,105.15,0,0,0,20.3,8.07C3.57,33.04-1,57.4.26,81.3a105.73,105.73,0,0,0,32.17,16.27,77.7,77.7,0,0,0,6.89-11.11,68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,65.74,0c.87.68,1.76,1.36,2.68,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.26c1.47-27.6-7.83-51.7-20.26-73.23ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.89,53,48.84,65.69,42.45,65.69Zm43.1,0C79.28,65.69,74.1,60,74.1,53s5-12.74,11.45-12.74S97,45.91,96.91,53,91.82,65.69,85.55,65.69Z" />
    <!-- Catchlight Glints in Clyde's Eyes for Studio Vitality -->
    <circle cx="45" cy="50" r="2.2" fill="#FFFFFF" opacity="0.9" />
    <circle cx="88" cy="50" r="2.2" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Creator Star / Asset Studio Sparkle (Top-Right) -->
  <g filter="url(#starGlow)">
    <path d="M100 13 C100 23.5 103 26.5 113.5 26.5 C103 26.5 100 29.5 100 40 C100 29.5 97 26.5 86.5 26.5 C97 26.5 100 23.5 100 13 Z" fill="url(#sparkleGrad)" />
    <!-- Center Pure Flare -->
    <circle cx="100" cy="26.5" r="1.8" fill="#FFFFFF" />
  </g>

  <!-- Secondary Accent Spark -->
  <path d="M84 15.5 C84 19.2 85 20.2 88.5 20.2 C85 20.2 84 21.2 84 25 C84 21.2 83 20.2 79.5 20.2 C83 20.2 84 19.2 84 15.5 Z" fill="#58E1FF" opacity="0.85" />

  <!-- Top Glass Sheen Overlay -->
  <path d="M5 30 C5 15.6 16.6 4 31 4 H97 C111.4 4 123 15.6 123 30 V50 C98 42 56 46 5 62 Z" fill="url(#topGleam)" />

  <!-- Beveled Squircle Rim Border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#rimGrad)" stroke-width="2" />
</svg>
