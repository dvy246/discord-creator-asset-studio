name: Technical SEO CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  seo-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history so sitemap lastmod derives real git dates
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (includes rules verification)
        run: npm run build

      - name: Run SEO test suite (unit + on-page)
        run: npm test

      - name: Assert ads.txt present
        run: test -f dist/ads.txt && echo "ads.txt OK"

      - name: Assert sitemap has lastmod + hreflang
        run: |
          grep -q '<lastmod>' dist/sitemap-0.xml && \
          grep -q 'xhtml:link' dist/sitemap-0.xml && \
          echo "Sitemap elite signals OK"
