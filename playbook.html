:root{--bg:#FFF6DC;--panel:#FFFBEF;--ink:#1B2542;--soft:#3B4668;--acc:#425B9A;--onacc:#FFF6DC;--line:#425B9A;--grid:rgba(66,91,154,.09);--sky:#76C0EC;--pink:#FF95A5;--font-h:'Familjen Grotesk',system-ui,sans-serif;--font-b:'Atkinson Hyperlegible',system-ui,sans-serif}
:root[data-theme=dark]{--bg:#121A2E;--panel:#1B2542;--ink:#FFF6DC;--soft:#D9D2BC;--acc:#76C0EC;--onacc:#1B2542;--line:#76C0EC;--grid:rgba(118,192,236,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 var(--font-b);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
h1,h2,h3,h4{font-family:var(--font-h);line-height:1.2;margin:0 0 .5rem}h1{font-size:2.6rem}h2{font-size:2.2rem}h3{font-size:1.5rem}h4{font-size:1.15rem}
a{color:var(--acc)}:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--panel);padding:8px;z-index:9}
header.top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:2px solid var(--line)}
.brand{font:700 1.15rem var(--font-h)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;max-width:1120px;margin:0 auto;padding:24px}
.wire{position:sticky;top:16px;align-self:start}.wire ol{list-style:none;margin:0;padding:0 0 0 22px;border-left:3px solid var(--line)}
.wire li{position:relative;margin:0 0 14px}.wire li::before{content:"";position:absolute;left:-30px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--line)}
.wire li.done::before{background:var(--pink);border-color:var(--ink)}.wire .tag{display:block;font-size:.9rem;color:var(--soft)}
main{min-width:0}section.block{margin:0 0 40px;max-width:62ch}
.hero{max-width:none;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;margin-bottom:48px}
.loop text{font:600 15px var(--font-h);fill:var(--ink)}.loop .n{fill:var(--sky);stroke:var(--ink);stroke-width:2}.loop .n.p{fill:var(--pink)}.loop path{stroke:var(--acc);stroke-width:3;fill:none}
.bubble{border:2px solid var(--line);background:var(--panel);border-radius:14px 14px 14px 2px;padding:10px 14px;margin:0 0 10px;max-width:52ch}.bubble.you{margin-left:auto;border-radius:14px 14px 2px 14px;background:var(--sky);color:#1B2542}
.bubble b{display:block;font:700 .95rem var(--font-h)}
.btn{font:600 1rem var(--font-h);min-height:44px;padding:8px 16px;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--sky);color:#1B2542}.btn:active{transform:translateY(1px)}.btn.primary{background:var(--acc);color:var(--onacc)}.btn.small{min-height:40px;padding:6px 10px;font-size:.95rem}
.btn[aria-disabled=true]{opacity:.55;cursor:not-allowed}
.labframe{border:3px solid var(--line);background:var(--panel);border-radius:12px;padding:20px;max-width:none}
.labframe .teaches{color:var(--soft)}.predict{border-left:6px solid var(--pink);padding:4px 12px;margin:12px 0}
.cards{list-style:none;margin:8px 0;padding:0;display:grid;gap:10px}.card{border:2px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;cursor:grab}.card p{margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px}.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}.lanebox{border:2px dashed var(--line);border-radius:8px;padding:10px;min-height:96px}
.reveal{margin:8px 0 0;padding:6px 10px;border-radius:6px;color:#1B2542;font-size:.95rem}.reveal.ok{background:var(--sky)}.reveal.bad{background:var(--pink)}.status{font-weight:700;margin:10px 0 0}
.breaks{border:2px solid var(--ink);border-left:10px solid var(--pink);background:var(--panel);padding:12px 16px;border-radius:8px}
fieldset.q{border:2px solid var(--line);border-radius:8px;margin:0 0 14px;padding:12px}fieldset.q label{display:block;padding:8px 4px;min-height:44px}
.recap{background:var(--sky);color:#1B2542;padding:14px 18px;border-radius:12px}.recap a{color:#1B2542}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:3px solid var(--line);padding:20px;overflow:auto;transform:translateX(100%);visibility:hidden;transition:transform .2s}
.drawer.open{transform:none;visibility:visible}
@media(max-width:820px){.layout{grid-template-columns:1fr;padding:16px}.wire{position:static}.hero,.lanes{grid-template-columns:1fr}h1{font-size:2.1rem}header.top{padding:10px 16px;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.bar{height:14px;border:2px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden}.bar span{display:block;height:100%;background:var(--pink)}
.ctx{white-space:pre-wrap;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:10px;font:.9rem/1.5 var(--font-b);max-height:260px;overflow:auto}
.sim{display:inline-block;background:var(--sky);color:#1B2542;padding:2px 10px;border-radius:6px;font-weight:700;font-size:.95rem}
input[type=number],input[type=search]{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit}

.wire details>summary{font:700 1.15rem var(--font-h);cursor:pointer;min-height:44px}.wire{max-height:calc(100vh - 32px);overflow:auto}.badges{padding-left:18px;font-size:.95rem}
.tbl{width:100%;border-collapse:collapse;margin:0 0 18px}.tbl caption{text-align:left;font:700 1.1rem var(--font-h);padding:4px 0}.tbl th,.tbl td{border:2px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}.tbl th{background:var(--sky);color:#1B2542;width:34%}
dt{font:700 1rem var(--font-h);margin-top:10px}dd{margin:0 0 4px}.how ol{padding-left:20px}
@media print{header.top,.wire,.drawer,.skip,.hero,.how,article,.btn{display:none!important}body{background:#fff;color:#000}.cheat,#glossary{display:block!important}}

select{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:6px;min-height:40px;padding:4px 8px;font:inherit;max-width:100%}details>summary{cursor:pointer;min-height:44px;font-weight:700}

a.btn{text-decoration:none;display:inline-flex;align-items:center}a.brand{color:var(--ink);text-decoration:none}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0 24px}.contents ol{padding-left:22px}.contents li{margin:0 0 8px}.wire a[aria-current=page]{font-weight:700}

</style></head><body><noscript>This course needs JavaScript. Please enable it and reload.</noscript><script>window.DATA={"chapters":[{"id":"ch1","part":"Part 1: Basics","title":"What is an agent?","scene":[{"who":"Maya, support lead","text":"We get 300 tickets a day. Can we just add an AI agent and be done?"},{"who":"You, the architect","text":"Maybe. First I need to know if we need an agent, or if something simpler will do."}],"concept":[{"h":"Three levels of autonomy","p":"A system that uses a language model can give the model very little control or a lot. Think of it as a dial with three marks."},{"h":"Single prompt","p":"You send one request to the model and get one answer. A prompt is the text you send to the model. This is the cheapest and easiest to test."},{"h":"Workflow","p":"Your code runs a fixed series of steps. Some steps call the model. You decide the order, so you can predict the path."},{"h":"Agent","p":"The model chooses the next step itself, uses tools, and repeats until it decides it is done. A tool is a function the model can ask your code to run. You gain flexibility and lose predictability."},{"h":"How to choose","p":"Start at the left of the dial. Move right only when the simpler level cannot do the job. The published guide Building effective agents makes the same point and describes these patterns in more depth."}],"lab":{"id":"lab01","title":"Sort the systems"},"breaks":"Giving the model control it does not need adds cost and delay, and makes failures harder to trace. A fixed series of steps is often easier to test and to explain.","quiz":[{"q":"In a workflow, who decides the order of the steps?","options":["The model","Your code","The user"],"answer":1,"why":"A workflow follows a path you wrote in code. That is what makes it predictable."},{"q":"Which system needs a loop where the model picks the next action?","options":["Translate a paragraph","Route an email to one of two prompts","Fix failing tests until they pass"],"answer":2,"why":"The number of attempts depends on feedback the model reads, so the model must drive the loop."},{"q":"Where should you start when you design a new system?","options":["With an agent, because it is the most powerful","With the simplest level that can do the job","With three agents that review each other"],"answer":1,"why":"Each step up the dial costs predictability. Move only when you must."}],"recap":["Prompt, workflow and agent differ in who chooses the next step.","Start simple and add autonomy only when needed.","An agent is a model that chooses actions in a loop."],"sources":[{"label":"Building effective agents (Anthropic)","url":"https://www.anthropic.com/engineering/building-effective-agents","checked":"Opened and read on 2026-10-04"}]},{"id":"ch2","part":"Part 1: Basics","title":"Anatomy of an agent","scene":[{"who":"Maya, support lead","text":"Order 1042 is late and the customer is angry. Can the agent just fix it?"},{"who":"You, the architect","text":"It can try. Let me show you what happens inside, one step at a time."}],"concept":[{"h":"Six parts","p":"An agent has six parts. The model reads text and decides what to do. The instructions tell it its job and its limits. Tools are functions it can ask your code to run. Memory is what it can remember between steps. The loop repeats until the work is done. The stop rule says when to quit."},{"h":"The loop","p":"Each turn has three moves. Think: the model reads everything so far and picks the next move. Act: your code runs the tool the model asked for. Observe: the tool result is added to the text the model reads next. Then the loop starts again."},{"h":"Context grows","p":"Context is all the text the model can see on one turn. Every think, act and observe step adds to it. A longer context costs more to process and leaves less room for new facts. The meter in the lab uses a rough rule, characters divided by four, so you can see the shape of the growth."},{"h":"The stop rule","p":"A loop with no stop rule can run forever. A good design stops when the task is done, and also stops at a fixed maximum number of steps. Anthropic's article on building effective agents describes stopping conditions such as a maximum number of iterations as a way to keep control."}],"lab":{"id":"lab02","title":"Agent loop stepper"},"breaks":"A loop with no stop rule and no step cap can keep calling tools while the context grows and costs rise. In the lab, the stop rule you pick decides whether that can happen.","quiz":[{"q":"What does the observe step do?","options":["Chooses the next tool","Adds the tool result to what the model reads next","Stops the loop"],"answer":1,"why":"Observe feeds the result back in, so the next think step can use it."},{"q":"Why add a maximum number of steps?","options":["It makes the model smarter","It keeps a stuck loop from running forever","It removes the need for tools"],"answer":1,"why":"A step cap is a safety exit that works even when the model never decides it is done."},{"q":"What happens to the context after each step?","options":["It grows","It resets","It stays the same"],"answer":0,"why":"Each think, act and observe adds text, so the model has more to read on the next turn."}],"recap":["An agent is a model, instructions, tools, memory, a loop and a stop rule.","Each turn is think, act, observe.","Context grows every step, so plan an exit."],"sources":[{"label":"Building effective agents (Anthropic)","url":"https://www.anthropic.com/engineering/building-effective-agents","checked":"Opened and read on 2026-10-04"}]},{"id":"ch3","part":"Part 1: Basics","title":"Tools a model can use well","scene":[{"who":"Dev, backend engineer","text":"I wrapped our whole order system in one tool called do_action. Done in an hour!"},{"who":"You, the architect","text":"Fast, yes. But the model will only see its name and description. Let us review it together."}],"concept":[{"h":"A tool is an interface","p":"A tool is a function with a name, a description and typed inputs. The model never sees your code. It only sees those three things, so they must be clear."},{"h":"Four checks","p":"Use four checks. Narrow: the tool does one job. Specific: the description says what it returns and when to use it. Typed: each input has an exact type, such as an integer or one value from a fixed list. Safe: risky actions are limited, or need a human to approve."},{"h":"Vague tools cost you","p":"When a name is vague, the model has to guess what a tool does and what to send it. Guesses can become wrong calls. One suggestion in Anthropic's article is to write a tool description like a docstring for a new teammate, with examples and clear limits."},{"h":"Make mistakes hard","p":"The same article describes poka-yoke, which means changing a design so a mistake is harder to make. As one example from the article, a coding tool was changed to require absolute file paths, and the authors report that the model then used it correctly."}],"lab":{"id":"lab03","title":"Tool review bench"},"breaks":"A tool the model has to guess about leads to wrong calls, and a broad write tool turns one wrong guess into real damage. Review tools before the model ever sees them.","quiz":[{"q":"Which type is the better choice for a refund amount?","options":["Free text","An integer in cents","Any object"],"answer":1,"why":"An exact type leaves less room for a wrong value."},{"q":"A tool can edit, cancel and delete orders. What is the best fix?","options":["Write a longer description","Split it into narrow tools and gate the risky ones","Rename it update"],"answer":1,"why":"Narrow tools are easier to describe, and risky ones can get their own approval step."},{"q":"What does the model see of your tool?","options":["The code","The name, description and inputs","The server logs"],"answer":1,"why":"That is why those three things carry the whole job of explaining the tool."}],"recap":["A tool is a name, a description and typed inputs.","Check four things: narrow, specific, typed, safe.","Make the wrong call hard to make."],"sources":[{"label":"Building effective agents (Anthropic), Appendix 2","url":"https://www.anthropic.com/engineering/building-effective-agents","checked":"Opened and read on 2026-10-04"}]},{"id":"ch4","part":"Part 1: Basics","title":"Context engineering","scene":[{"who":"Dev, backend engineer","text":"The agent is great for three steps. Then it forgets the refund policy."},{"who":"You, the architect","text":"Let us see what is filling its window before we blame the model."}],"concept":[{"h":"The window is a budget","p":"Context is everything the model can see on one turn. The context window is the limit on how much that can be. Anthropic's article on context engineering calls context a critical but finite resource, and says the goal is the smallest set of high-signal tokens that gets the result you want. A token is a small piece of text, about a few characters."},{"h":"What fills it","p":"Five things share the space: the system prompt, the tool definitions, the message history, retrieved text, and tool output. The article lists these parts of the context state. In a loop, history and tool output tend to grow the fastest, because every step adds more."},{"h":"Three ways to make room","p":"Trimming drops the oldest history. Summarizing replaces history with a shorter version. Anthropic calls this compaction. Offloading saves a big tool output outside the context and keeps a short pointer. The article describes a related idea, clearing old tool results, as one of the lightest forms of compaction."},{"h":"Every option has a price","p":"Trimming loses facts. Summarizing can blur details, and the article warns that very aggressive compaction can lose subtle context whose value only shows later. Offloading needs a tool to read the output back. The lab shows each price with numbers you type in yourself."}],"lab":{"id":"lab04","title":"Context budget board"},"breaks":"A full context does not fail loudly. The article cites studies where recall of facts got worse as the context grew, so an agent can start to forget things before it reaches the hard limit.","quiz":[{"q":"Which part of the context usually grows fastest in a long loop?","options":["The system prompt","History and tool output","The tool definitions"],"answer":1,"why":"Each step adds a new action and a new result, while the system prompt stays the same."},{"q":"What does offloading a tool output do?","options":["Saves it outside the context and keeps a short pointer","Deletes it for good","Makes the window bigger"],"answer":0,"why":"The agent keeps a small reference and can read the full output back with a tool."},{"q":"What is the main risk of summarizing history?","options":["Details can be lost","The model gets slower to start","Tools stop working"],"answer":0,"why":"A summary keeps the main points, but a small detail can be dropped and missed later."}],"recap":["The context window is a budget you spend on five parts.","Trim, summarize or offload to make room.","Each choice has a cost, so pick on purpose."],"sources":[{"label":"Effective context engineering for AI agents (Anthropic)","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","checked":"Opened and read on 2026-10-04"}],"game":"Loop Run"},{"id":"ch5","part":"Part 2: Core patterns","title":"Workflow patterns","scene":[{"who":"Maya, support lead","text":"Messages come in about billing, bugs and gift cards. One giant prompt keeps mixing them up."},{"who":"You, the architect","text":"Then we do not need an agent yet. We need the right workflow pattern."}],"concept":[{"h":"Five patterns","p":"Anthropic's article describes five workflow patterns. A workflow is a system where models and tools follow paths your code defines. Each pattern solves a different shape of problem, so learning to recognise the shape is the skill."},{"h":"Chaining and routing","p":"Prompt chaining splits a task into steps, and each call uses the previous output. You can add a check, called a gate, between steps. Routing classifies the input first and sends it to a specialized handler, so each prompt stays focused."},{"h":"Parallelization","p":"Parallelization runs calls at the same time and combines the results in code. The article names two forms. Sectioning splits a task into independent parts. Voting runs the same task several times to gain confidence."},{"h":"Orchestrator and evaluator","p":"In orchestrator-workers, a central model decides the subtasks at run time, hands them to workers and merges the results. In evaluator-optimizer, one call writes and another critiques, in a loop. The article says this fits best when you have clear criteria for good."}],"lab":{"id":"lab05","title":"Pattern matcher"},"breaks":"Using a pattern that does not fit the shape of the task adds cost without adding quality. The article advises finding the simplest solution and adding complexity only when it clearly improves results.","quiz":[{"q":"Which pattern lets a central model decide the subtasks at run time?","options":["Routing","Orchestrator-workers","Prompt chaining"],"answer":1,"why":"The subtasks are not fixed in advance, so a central model has to choose them."},{"q":"What is a gate in prompt chaining?","options":["A programmatic check between steps","A second model that rewrites the answer","A limit on tokens"],"answer":0,"why":"A gate checks an intermediate result so the chain stays on track."},{"q":"When does evaluator-optimizer fit best?","options":["When there are clear criteria for a good answer","When every input is different","When speed matters more than quality"],"answer":0,"why":"The evaluator needs something concrete to judge against, or the loop has no direction."}],"recap":["Five patterns: chaining, routing, parallelization, orchestrator-workers, evaluator-optimizer.","Match the pattern to the shape of the task.","Start simple and add complexity only when it helps."],"sources":[{"label":"Building effective agents (Anthropic)","url":"https://www.anthropic.com/engineering/building-effective-agents","checked":"Opened and read on 2026-10-04"}],"game":"Pattern Draft"},{"id":"ch6","part":"Part 2: Core patterns","title":"Retrieval for agents","scene":[{"who":"Dev, backend engineer","text":"The agent answered a refund question with something that sounded right but was not in our policy."},{"who":"You, the architect","text":"It never checked. Let us teach it to search, grade what it finds, and say so when nothing fits."}],"concept":[{"h":"Retrieval","p":"Retrieval means fetching text the model does not already have, such as a help page, and placing it in the context. Anthropic's context engineering article describes a just-in-time approach. The agent keeps light references, like file paths or links, and loads the data only when it needs it."},{"h":"Retrieve, grade, rewrite, answer","p":"This course uses a simple loop. Retrieve the best pages. Grade them: do they really match the question? If not, rewrite the query once and try again. If still nothing fits, say so. Otherwise answer from the pages."},{"h":"Grading is the key step","p":"A search always returns something, even when nothing is relevant. Grading is the check that stops weak results from reaching the answer. The lab uses a plain rule: at least half of the query words must appear in the page."},{"h":"Know when to stop","p":"Rewriting forever wastes time and money. Allow one rewrite, then give a clear answer that the information was not found. An honest I could not find it is better than a guess."}],"lab":{"id":"lab06","title":"Retrieve, grade, rewrite stepper"},"breaks":"A system that always answers, even with weak results, can state things the sources do not say. In the lab, the third question has no good page, and the right move is to say so and stop.","quiz":[{"q":"What does the grade step decide?","options":["Whether the results really match the question","Which model to use","How long the answer should be"],"answer":0,"why":"Grading checks relevance before anything reaches the answer."},{"q":"What should the agent do if no page matches after one rewrite?","options":["Answer from the best weak match","Keep rewriting until something matches","Say it could not find the answer and stop"],"answer":2,"why":"A clear not found answer is more honest and cheaper than a guess or an endless loop."},{"q":"Why is the scoring in the lab plain keyword matching?","options":["Real systems only use keywords","It is easy to see and check, so you can follow every step","It is the fastest method"],"answer":1,"why":"Simple scoring is transparent. Real systems often use other methods, but the loop is the same."}],"recap":["Retrieve, grade, rewrite once, then answer or stop.","Grading keeps weak results out of the answer.","Saying not found is a correct result."],"sources":[{"label":"Effective context engineering for AI agents (Anthropic)","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","checked":"Opened and read on 2026-10-04"}]},{"id":"ch7","part":"Part 2: Core patterns","title":"Memory and state","scene":[{"who":"Maya, support lead","text":"A customer came back and had to explain everything again. And someone pasted a password into the chat last week."},{"who":"You, the architect","text":"So memory needs two rules: remember what helps, and never keep what hurts."}],"concept":[{"h":"Short and long term","p":"Short-term memory is the thread, the messages in the current conversation. Long-term memory is information saved to use in later conversations. A checkpoint is a saved snapshot of the state of a run, so it can be resumed or inspected."},{"h":"Outside the window","p":"Anthropic's context engineering article describes structured note-taking, where the agent writes notes to storage outside the context window and reads them back later. This keeps the window small while keeping what matters."},{"h":"Four choices","p":"For each piece of information you can keep it in the thread only, save it long term, summarize it and drop the details, or let it expire. For some data the right choice is to never store it at all."},{"h":"Privacy","p":"Memory can hold personal data, so it needs rules. Tell people what you keep, keep as little as you need, and avoid storing secrets. The laws that apply depend on where you operate, so check them for your own case."}],"lab":{"id":"lab07","title":"Memory designer"},"breaks":"Memory that keeps too much holds secrets longer than needed and can show them later. Memory that keeps too little makes people repeat themselves. Laws differ by place, so check the rules that apply to you.","quiz":[{"q":"What is a checkpoint?","options":["A saved snapshot of a run's state","A rule that blocks a tool","A summary of the user"],"answer":0,"why":"A checkpoint lets you resume or inspect a run from a saved point."},{"q":"Where should a password pasted into the chat go?","options":["Long-term memory","A summary","Nowhere, never store it"],"answer":2,"why":"A secret has no good reason to be kept and many ways to leak."},{"q":"Why summarize a long uploaded document?","options":["To keep the points you need without the whole file","To make it more secret","Because summaries are always exact"],"answer":0,"why":"A summary saves space, but it can lose details, so keep what matters."}],"recap":["Thread is short term. Long-term memory carries across chats.","Choose: thread, long term, summarize, expire, or never store.","Keep as little personal data as you can."],"sources":[{"label":"Effective context engineering for AI agents (Anthropic)","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","checked":"Opened and read on 2026-10-04"}]},{"id":"ch8","part":"Part 2: Core patterns","title":"Autonomy and human approval","scene":[{"who":"Dev, backend engineer","text":"If the agent can refund and delete, why not let it do both on its own? That is the point of an agent."},{"who":"You, the architect","text":"The point is to be useful and safe. Let us sort every action by how much damage a mistake could do."}],"concept":[{"h":"Three levels","p":"Every action your agent can take can be handled in one of three ways. Automatic means it runs on its own. Needs approval means a person must say yes first. Forbidden means the agent can never do it, whatever it is told."},{"h":"Why not automate everything","p":"Anthropic's article notes that the autonomy of agents means higher costs and the potential for compounding errors, and it recommends extensive testing in sandboxed environments along with appropriate guardrails."},{"h":"Checkpoints","p":"The same article says agents can pause for human feedback at checkpoints or when they hit a blocker. An approval gate is a checkpoint placed before an action that is costly or hard to undo."},{"h":"Too strict costs too","p":"Asking for approval on everything stalls the work and teaches people to click yes without reading. Match the control to the risk: low risk runs on its own, risky actions wait for a person, and some actions are never allowed."}],"lab":{"id":"lab08","title":"Risk matrix"},"breaks":"Giving an agent more freedom than the risk allows lets a mistake reach the real world. Giving it too little buries people in approvals. The lab shows the cost of each wrong choice.","quiz":[{"q":"Which action fits Needs approval best?","options":["Reading an order status","Issuing a refund","Tagging a ticket"],"answer":1,"why":"A refund moves money and is hard to undo, so a person should confirm it."},{"q":"What is a common cost of requiring approval for everything?","options":["Work stalls and people approve without reading","The model forgets its tools","Costs always drop"],"answer":0,"why":"Too many prompts create delay and habit clicking, which weakens the gate."},{"q":"Who decides what is Forbidden?","options":["The model, at run time","You, in the design","The user, in chat"],"answer":1,"why":"Forbidden is a design rule set in advance, not something the model can talk itself out of."}],"recap":["Sort actions: automatic, needs approval, forbidden.","Put approval gates before costly or hard to undo actions.","Match control to risk, no more and no less."],"sources":[{"label":"Building effective agents (Anthropic)","url":"https://www.anthropic.com/engineering/building-effective-agents","checked":"Opened and read on 2026-10-04"}],"game":"Gatekeeper"},{"id":"ch9","part":"Part 3: Advanced","title":"Multi-agent systems","scene":[{"who":"Maya, support lead","text":"Leadership wants a team of five agents: a planner, a researcher, a writer, a reviewer and a manager."},{"who":"You, the architect","text":"Before we add agents, let us count what they cost us."}],"concept":[{"h":"Three shapes","p":"A multi-agent system has more than one model-driven agent working together. In a supervisor shape, one agent sends subtasks to workers and merges the results. In a pipeline, work passes from one agent to the next in a fixed order. In a handoff, one agent passes the whole conversation to another that is better suited."},{"h":"The cost of talking","p":"Every message between agents is text that must be written, sent and read, so it costs tokens and time. Agents also need shared facts, so each one may need its own copy of the context. The lab lets you count this cost with your own numbers."},{"h":"A related pattern","p":"Anthropic's article describes orchestrator-workers, where a central model breaks a task down at run time and delegates to workers. That is one form of the supervisor shape. The same article advises finding the simplest solution and adding complexity only when it is needed."},{"h":"When not to","p":"Do not add agents just because a task has several steps. One agent with good tools is often enough. Consider a team when parts of the work are independent, when one agent's context would overflow, or when parts need different tools or permissions."}],"lab":{"id":"lab09","title":"Topology builder"},"breaks":"Each extra agent adds messages that can be lost, misread or repeated, and a team can hide who made a mistake. Count the coordination cost before you add an agent.","quiz":[{"q":"Which shape passes work in a fixed order from one agent to the next?","options":["Supervisor","Pipeline","Handoff"],"answer":1,"why":"A pipeline is a fixed chain, and each agent's output is the next one's input."},{"q":"What is always added when you split work across agents?","options":["Smarter models","Coordination messages that cost tokens and time","Free extra speed"],"answer":1,"why":"Agents must talk, and talking is not free."},{"q":"When is a team most likely worth it?","options":["When parts are independent or one agent would overflow its context","Never","Whenever a task has several steps"],"answer":0,"why":"Independent parts can run side by side, and a split can keep each context small."}],"recap":["Three shapes: supervisor, pipeline, handoff.","Coordination costs tokens and time.","Start with one agent and add more only for a clear reason."],"sources":[{"label":"Building effective agents (Anthropic)","url":"https://www.anthropic.com/engineering/building-effective-agents","checked":"Opened and read on 2026-10-04"}]},{"id":"ch10","part":"Part 3: Advanced","title":"Failure modes and guardrails","scene":[{"who":"Dev, backend engineer","text":"One run last night cost more than a whole normal day. And a customer got two refunds."},{"who":"You, the architect","text":"Both are known failure modes. Let us practise the defense for each."}],"concept":[{"h":"Six ways agents fail","p":"Loops repeat the same step. The wrong tool gets chosen. Arguments are malformed. Costs run away. An action repeats after a retry. Context goes stale. Each one is worth designing for before it happens."},{"h":"Limits and validation","p":"A limit stops a run at a number of steps, tokens or cost. Anthropic's article mentions stopping conditions, such as a maximum number of iterations, as a way to maintain control. Validation checks arguments against a schema and returns a clear error that the model can use to fix its call."},{"h":"Fallback and idempotency","p":"A fallback hands the case to a person when the agent is stuck. An idempotency key makes a repeated request run only once, so a retry cannot refund twice. A freshness rule re-fetches or expires facts that can change."},{"h":"Compounding errors","p":"The same article says the autonomy of agents means higher costs and the potential for compounding errors, and it recommends extensive testing in sandboxed environments along with appropriate guardrails."}],"lab":{"id":"lab10","title":"Failure injection"},"breaks":"A defense that lives only in the prompt can be skipped by the model. Put hard limits and checks in code, where the model cannot talk its way past them.","quiz":[{"q":"What does an idempotency key prevent?","options":["Long prompts","A repeated request running twice","Slow responses"],"answer":1,"why":"The system recognises the retry as the same request and runs it once."},{"q":"Why put limits in code and not only in the prompt?","options":["The model cannot talk its way past code","Code is shorter","Prompts cost more"],"answer":0,"why":"A prompt asks. Code enforces."},{"q":"What should a validation error do?","options":["Explain the problem so the model can fix the call","Stop the whole system","Be hidden from the model"],"answer":0,"why":"A clear message lets the agent repair its own mistake."}],"recap":["Know the six failure modes.","Use limits, validation, fallback, idempotency and freshness.","Enforce defenses in code."],"sources":[{"label":"Building effective agents (Anthropic)","url":"https://www.anthropic.com/engineering/building-effective-agents","checked":"Opened and read on 2026-10-04"}],"game":"Incident Room"},{"id":"ch11","part":"Part 3: Advanced","title":"Security for agents","scene":[{"who":"Maya, support lead","text":"A customer pasted a note that says to ignore the rules. The agent nearly followed it."},{"who":"You, the architect","text":"That is prompt injection. We will limit what the agent can do, not only what it hears."}],"concept":[{"h":"Two kinds","p":"OWASP lists prompt injection as the first risk for LLM applications in its 2025 edition. Direct injection comes from the user's own input. Indirect injection comes from external content that the model reads, such as websites or files."},{"h":"Models cannot always tell","p":"OWASP says retrieval and fine-tuning do not fully mitigate prompt injection, and that it is unclear whether fool-proof prevention exists. So plan for an injection to sometimes work, and limit the damage when it does."},{"h":"Limit the damage","p":"OWASP suggests least privilege, human approval for high-risk actions, and separating untrusted content from the rest. Excessive agency, listed as its own entry on the same list, means giving a system more ability or permission than its job needs."},{"h":"Trust tools and servers","p":"Tools and servers you connect are part of your attack surface. The MCP specification suggests showing which tools are exposed to the model, showing when tools run, and asking for user confirmation on operations so that a human stays in the loop."}],"lab":{"id":"lab11","title":"Spot the injection and permission scope designer"},"breaks":"Filtering for bad words is not enough. OWASP describes attacks hidden in web pages and documents, and others that encode the instructions. Design so that a successful injection still cannot do much damage.","quiz":[{"q":"What is indirect prompt injection?","options":["A user typing in capital letters","A slow tool","Instructions hidden in external content the model reads"],"answer":2,"why":"The attack arrives through data the agent reads, not through the user's own message."},{"q":"Which control limits the damage even if an injection works?","options":["A longer system prompt","Least privilege permissions","A friendlier tone"],"answer":1,"why":"If the agent cannot do a harmful thing, the injection cannot make it."},{"q":"What should happen before a high-risk action?","options":["The model double checks","Nothing, to keep things fast","A human approves it"],"answer":2,"why":"A person is a check the model cannot be talked out of."}],"recap":["Direct and indirect injection are different routes in.","Limit privileges and require approval for high-risk actions.","Treat tool and server output as data."],"sources":[{"label":"OWASP LLM01:2025 Prompt Injection","url":"https://genai.owasp.org/llmrisk/llm01-prompt-injection/","checked":"Opened and read on 2026-10-04"},{"label":"MCP specification: Tools","url":"https://modelcontextprotocol.io/specification/2025-06-18/server/tools","checked":"Read via search excerpt on 2026-10-04. The site lists a newer version, so check the current one"}]},{"id":"ch12","part":"Part 3: Advanced","title":"Evaluation and observability","scene":[{"who":"Dev, backend engineer","text":"The final answers look fine. Why does the agent still cost so much?"},{"who":"You, the architect","text":"Because we only read the answers. We need to read the paths."}],"concept":[{"h":"Judge the path","p":"A trajectory is the full record of what an agent did: each thought, tool call and result. A trace is a recorded trajectory you can read later. The final answer can look right while the path wasted steps or took risky actions."},{"h":"Two simple measures","p":"Task success asks whether the run reached the right outcome. Step efficiency compares the shortest known path with the steps actually taken. In the lab, efficiency counts successful runs only, because a failed run has no useful comparison."},{"h":"Find the first wrong step","p":"For every bad run, find the first step that went wrong. Later steps often just follow from that mistake, so fix the first one."},{"h":"A regression set","p":"A regression set is a small collection of cases you rerun after each change, to check that old problems stay fixed. Anthropic's article says the key is measuring performance and iterating, and that complexity should be added only when it demonstrably improves outcomes."}],"lab":{"id":"lab12","title":"Trace reviewer"},"breaks":"Reading only final answers can hide loops, risky actions and lucky guesses. A run can succeed for the wrong reasons and fail the next time.","quiz":[{"q":"What is a trajectory?","options":["The full record of an agent's steps","The final answer only","The price per token"],"answer":0,"why":"It includes every thought, action and result along the way."},{"q":"Why look for the first wrong step?","options":["It is always a tool call","Later steps often follow from it","It is always the shortest"],"answer":1,"why":"Fixing the root mistake often fixes what came after."},{"q":"What belongs in a regression set?","options":["Only perfect runs","Random text","Cases that failed or wasted steps"],"answer":2,"why":"Those are the cases you most want to keep checking."}],"recap":["Read trajectories, not just answers.","Measure task success and step efficiency.","Keep a regression set and rerun it after every change."],"sources":[{"label":"Building effective agents (Anthropic)","url":"https://www.anthropic.com/engineering/building-effective-agents","checked":"Opened and read on 2026-10-04"}],"game":"Trace Detective"},{"id":"ch13","part":"Part 3: Advanced","title":"Cost, latency and scale","scene":[{"who":"Maya, support lead","text":"Finance asks what a thousand runs a month will cost."},{"who":"You, the architect","text":"I can build a model, but the prices must come from our provider, not from my memory."}],"concept":[{"h":"Cost is steps times tokens","p":"Each step reads input tokens and writes output tokens, and providers usually price them per token. Cost per run is roughly steps times the cost of one step. Anthropic's article notes that agentic systems often trade latency and cost for better task performance."},{"h":"Latency adds up","p":"Steps in a loop run one after another, so time per run grows with the number of steps. Steps that can run in parallel save time but not tokens."},{"h":"Three levers","p":"A step cap limits how long a run can go. Model routing sends easy steps to a cheaper model. Caching may lower the price of input text that repeats between steps. Some providers offer caching, so check whether yours does and how it is priced."},{"h":"Check the prices","p":"This course contains no prices because they change. Type in the prices from your provider's page, check them again before you decide, and keep one currency throughout."}],"lab":{"id":"lab13","title":"Cost and latency estimator"},"breaks":"An estimate is only as good as its inputs. If your steps per run or tokens per step are guesses, measure a real run before you trust the result.","quiz":[{"q":"Why does this lab have no built-in prices?","options":["Prices do not matter","Prices change, so you enter current ones","They are secret"],"answer":1,"why":"Only your provider's current page is a reliable source."},{"q":"What does a step cap control?","options":["The model name","The output language","How long a run can go"],"answer":2,"why":"It limits steps, which limits both cost and time."},{"q":"Which lever sends easy steps to a cheaper model?","options":["Model routing","Caching","Step cap"],"answer":0,"why":"Routing picks the model per step."}],"recap":["Cost is roughly steps times the cost of a step.","Levers: step cap, routing, caching.","Always use prices you checked yourself."],"sources":[{"label":"Building effective agents (Anthropic)","url":"https://www.anthropic.com/engineering/building-effective-agents","checked":"Opened and read on 2026-10-04"}]},{"id":"ch14","part":"Part 3: Advanced","title":"Protocols and integration","scene":[{"who":"Dev, backend engineer","text":"Another team offers an agent, and our vendor offers a server with tools. Do we treat them the same?"},{"who":"You, the architect","text":"They are different things, and both change fast. Let us map them."}],"concept":[{"h":"Why protocols","p":"A protocol is a shared set of rules so different systems can talk. Two are common in agent work. The Model Context Protocol, or MCP, connects an agent application to tools and data. The Agent2Agent protocol, or A2A, connects one agent to another."},{"h":"What an MCP server offers","p":"The MCP specification says servers can offer resources, which are context and data, prompts, which are templates for users, and tools, which are functions for the model to run. In MCP, tools are model-controlled and prompts are user-controlled."},{"h":"What A2A describes","p":"The A2A specification describes an open standard for communication between independent, potentially opaque agent systems. An agent publishes an Agent Card, a JSON description of its identity, capabilities, skills, endpoint and authentication needs, and other agents send it tasks."},{"h":"Check before you build","p":"These specifications have several versions, and details such as file locations and method names differ between them. Read the current version for your project. Connecting a server or a peer also adds trust questions, which chapter 11 covered."}],"lab":{"id":"lab14","title":"Capability map"},"breaks":"Treating a peer agent like a trusted function is risky. Its answers are data, and its actions may be outside your control. Apply the same least privilege and approval rules you use for any tool.","quiz":[{"q":"In MCP, which server feature is meant for the model to run?","options":["Prompts","Resources","Tools"],"answer":2,"why":"Tools are functions for the model to execute."},{"q":"What does an A2A Agent Card describe?","options":["An agent's identity, capabilities, skills and endpoint","A user's password","A tool's source code"],"answer":0,"why":"It is the public description other agents read before sending tasks."},{"q":"Why check the current specification?","options":["It is optional","Versions differ in details","They never change"],"answer":1,"why":"Details change between versions, so old examples can be wrong."}],"recap":["MCP connects agents to tools and data; A2A connects agents to agents.","MCP servers offer tools, resources and prompts.","Read the current specification before you build."],"sources":[{"label":"MCP specification overview","url":"https://modelcontextprotocol.io/specification/2025-06-18","checked":"Read via search excerpt on 2026-10-04. The site lists a newer version, so check the current one"},{"label":"A2A protocol specification","url":"https://a2a-protocol.org/v1.0.0/specification/","checked":"Read via search excerpt on 2026-10-04. Versions differ in details, so check the current one"}]},{"id":"ch15","part":"Part 4: Capstone","title":"Design studio","scene":[{"who":"Maya, support lead","text":"The board wants one picture of the whole system, and a reason for every box."},{"who":"You, the architect","text":"Then let us draw it, and let the lint tell us what is missing."}],"concept":[{"h":"Put it all together","p":"You now know the parts: a model, tools, retrieval, memory, guardrails, human approval, limits, evaluation and tracing. A design is a picture of how they connect, with a reason for every box and every arrow."},{"h":"Start from the requirements","p":"Each case brief has requirement cards. Start with what the system must do. Add only the components that serve those requirements, then add the controls that keep it safe."},{"h":"Lint your design","p":"Design lint is a set of checks you run on a drawing, like a spell checker for architecture. The lab checks for seven problems, such as a write tool with no approval gate, no step limit, no tracing, retrieval with no permission filter, and a loop with no limit."},{"h":"A design is not a proof","p":"A clean lint result means the obvious mistakes are gone. It does not prove the system works. You still need tests, traces and a regression set, as chapter 12 described."}],"lab":{"id":"lab15","title":"Architecture canvas"},"breaks":"A design with every box added is not a good design. Each component adds cost and something that can fail. Add a component only when a requirement or a risk calls for it.","quiz":[{"q":"What does design lint check?","options":["A drawing for known mistakes","The speed of the model","Spelling"],"answer":0,"why":"It looks for known design problems, such as a write tool with no approval gate."},{"q":"Which design has a problem?","options":["A read tool with a tracer","A write tool behind an approval gate","A write tool with no approval gate"],"answer":2,"why":"Nothing stands between a mistake and a real change."},{"q":"What does a clean lint result prove?","options":["That the system works","That costs are low","That the obvious mistakes are gone"],"answer":2,"why":"It is a first filter. Testing and traces come next."}],"recap":["Start from requirements, then add controls.","Lint finds known design mistakes.","A clean design still needs tests and traces."],"sources":[{"label":"Building effective agents (Anthropic)","url":"https://www.anthropic.com/engineering/building-effective-agents","checked":"Opened and read on 2026-10-04"},{"label":"OWASP LLM01:2025 Prompt Injection","url":"https://genai.owasp.org/llmrisk/llm01-prompt-injection/","checked":"Opened and read on 2026-10-04"}]},{"id":"ch16","part":"Part 4: Capstone","title":"Defend your design, and from design to code","scene":[{"who":"Maya, support lead","text":"The review is tomorrow. They will ask why for every box."},{"who":"You, the architect","text":"Then let us practise the answers, and look at how the same design becomes code."}],"concept":[{"h":"Defend your design","p":"A design review asks why. For each choice, tie your answer to a risk, a cost or a measurement. A good answer says what could go wrong without the choice, and how you will know it works."},{"h":"From design to LangGraph","p":"LangGraph is a library where you build agent workflows as graphs. State is the record that nodes share. Nodes are functions that update the state, and edges decide which node runs next. Your design maps onto it: the model, retriever and tools become nodes, a loop becomes an edge back, and the approval gate becomes an interrupt."},{"h":"Gates and limits in code","p":"The LangGraph docs describe interrupt, which pauses a run until you resume it with a Command, and they list a checkpointer as a requirement for saving the state while it waits. They also describe a recursion limit, a cap on steps that raises an error when the graph reaches it."},{"h":"Read the code","p":"The code below was run in a clean environment, with a scripted function in place of the model. It shows the support agent from earlier chapters: it looks up an order, asks a person to approve the refund, and a second graph is stopped by a step limit."}],"lab":{"id":"lab16","title":"Defend your design"},"breaks":"Code you have not run is a guess. Run it, with a stand-in for the model, before you trust it. Library APIs change, so check the current docs for your version.","quiz":[{"q":"What does interrupt do in LangGraph?","options":["Makes the model faster","Pauses the run until you resume it","Deletes the state"],"answer":1,"why":"The run waits, with its state saved, until a Command resumes it."},{"q":"What do you need to save state while a run waits?","options":["A bigger model","A cache of prices","A checkpointer"],"answer":2,"why":"The docs list a checkpointer as a requirement for this."},{"q":"What does a recursion limit do?","options":["Caps the steps and raises an error past it","Makes answers shorter","Chooses the model"],"answer":0,"why":"It is the step limit from your design, enforced in code."}],"recap":["Tie every answer to a risk, a cost or a measurement.","Approval gates map to interrupts, limits to a recursion limit.","Run code before you trust it."],"sources":[{"label":"LangGraph docs: human-in-the-loop","url":"https://docs.langchain.com/oss/python/langgraph/human-in-the-loop","checked":"Read via search excerpt on 2026-10-04"},{"label":"LangGraph docs: graph recursion limit","url":"https://docs.langchain.com/oss/python/GRAPH_RECURSION_LIMIT","checked":"Read via search excerpt on 2026-10-04"}],"code":[{"title":"The support agent as a LangGraph graph","status":"Tested","checked":"Ran in a clean virtual environment with langgraph 1.2.12 on 2026-10-04. A scripted function stands in for the model, so no API key is needed.","url":"https://docs.langchain.com/oss/python/langgraph/human-in-the-loop","urlLabel":"LangGraph docs: human-in-the-loop","lines":["from typing import TypedDict","from langgraph.graph import StateGraph, START, END","from langgraph.checkpoint.memory import InMemorySaver","from langgraph.types import interrupt, Command","from langgraph.errors import GraphRecursionError","","SCRIPT = [\"get_order\", \"get_policy\", \"request_refund\", \"finish\"]","","class State(TypedDict):","    step: int","    action: str","    log: list[str]","","def agent(state: State):","    # Stand-in for the model: picks the next scripted action.","    return {\"action\": SCRIPT[state[\"step\"]]}","","def route(state: State):","    if state[\"action\"] == \"finish\":","        return END","    if state[\"action\"] == \"request_refund\":","        return \"approval\"","    return \"tools\"","","def approval(state: State):","    ok = interrupt({\"question\": \"Approve the refund for order 1042?\"})","    return {\"log\": state[\"log\"] + [\"human said \" + str(ok)], \"action\": \"request_refund\" if ok else \"finish\"}","","def after_approval(state: State):","    return \"tools\" if state[\"action\"] == \"request_refund\" else END","","def tools(state: State):","    return {\"log\": state[\"log\"] + [\"ran \" + state[\"action\"]], \"step\": state[\"step\"] + 1}","","builder = StateGraph(State)","builder.add_node(\"agent\", agent)","builder.add_node(\"approval\", approval)","builder.add_node(\"tools\", tools)","builder.add_edge(START, \"agent\")","builder.add_conditional_edges(\"agent\", route)","builder.add_conditional_edges(\"approval\", after_approval)","builder.add_edge(\"tools\", \"agent\")","graph = builder.compile(checkpointer=InMemorySaver())","","config = {\"configurable\": {\"thread_id\": \"ticket-1042\"}}","first = graph.invoke({\"step\": 0, \"action\": \"\", \"log\": []}, config)","print(\"paused:\", first[\"__interrupt__\"][0].value)","done = graph.invoke(Command(resume=True), config)","print(\"log:\", done[\"log\"])","","# Step limit: a graph that never reaches a stop condition.","loop = StateGraph(State)","loop.add_node(\"agent\", lambda s: {\"action\": \"get_order\"})","loop.add_node(\"tools\", lambda s: {\"step\": s[\"step\"] + 1})","loop.add_edge(START, \"agent\")","loop.add_edge(\"agent\", \"tools\")","loop.add_edge(\"tools\", \"agent\")","looping = loop.compile()","try:","    looping.invoke({\"step\": 0, \"action\": \"\", \"log\": []}, {\"recursion_limit\": 6})","except GraphRecursionError:","    print(\"stopped by the step limit\")"],"notes":[{"line":9,"text":"State is the record that every node reads and updates."},{"line":14,"text":"A scripted stand-in for the model, so the code runs with no API key."},{"line":26,"text":"interrupt pauses the run and waits for a person to answer."},{"line":43,"text":"The checkpointer saves the state, which is needed while a run waits."},{"line":48,"text":"Command(resume=...) continues the run, and its value becomes the return value of interrupt."},{"line":60,"text":"recursion_limit caps the steps. Past it, LangGraph raises GraphRecursionError."}],"output":["paused: {'question': 'Approve the refund for order 1042?'}","log: ['ran get_order', 'ran get_policy', 'human said True', 'ran request_refund']","stopped by the step limit"]}],"game":"Design Duel"}],"glossary":[{"term":"A2A","def":"Agent2Agent protocol. An open standard for communication between independent agent systems."},{"term":"Agent","def":"A system where the model chooses its own next steps and tools, in a loop."},{"term":"Agent Card","def":"A JSON description an A2A agent publishes: its identity, skills, endpoint and how to authenticate."},{"term":"Approval gate","def":"A step where a person must say yes before a costly or hard to undo action runs."},{"term":"Checkpoint","def":"A saved snapshot of the state of a run, so it can be resumed or inspected."},{"term":"Compaction","def":"Replacing a long history with a shorter summary to free space in the context."},{"term":"Context","def":"All the text the model can see on one turn."},{"term":"Context window","def":"The limit on how much text the model can see on one turn."},{"term":"Design lint","def":"A set of automatic checks that look for known mistakes in an architecture drawing."},{"term":"Direct prompt injection","def":"An attack that comes from the user's own input."},{"term":"Evaluator-optimizer","def":"A pattern where one call writes, another critiques, and the loop repeats."},{"term":"Excessive agency","def":"Giving a system more ability or permission than its job needs."},{"term":"Gate","def":"A programmatic check between steps of a chain."},{"term":"Grading","def":"Checking whether retrieved text really matches the question before using it."},{"term":"Idempotency key","def":"A label that lets a system run a repeated request only once."},{"term":"Indirect prompt injection","def":"An attack hidden in external content the model reads, such as a web page or file."},{"term":"Interrupt","def":"In LangGraph, a pause in a run that waits for a person to resume it."},{"term":"Least privilege","def":"Giving an agent only the permissions its job needs."},{"term":"Long-term memory","def":"Information saved to use in later conversations."},{"term":"MCP","def":"Model Context Protocol. A protocol that connects an agent application to tools, data and prompts."},{"term":"Observe","def":"The step where a tool result is added to what the model reads next."},{"term":"Offloading","def":"Saving a large tool output outside the context and keeping a short pointer to it."},{"term":"Orchestrator-workers","def":"A pattern where a central model decides subtasks at run time and delegates them to workers."},{"term":"Parallelization","def":"Running several calls at the same time and combining the results in code."},{"term":"Poka-yoke","def":"Changing a design so a mistake is harder to make."},{"term":"Prompt","def":"The text you send to a model."},{"term":"Prompt chaining","def":"A fixed series of calls where each uses the previous output."},{"term":"Recursion limit","def":"In LangGraph, a cap on steps that raises an error when a graph reaches it."},{"term":"Regression set","def":"A small collection of cases you rerun after each change to check old problems stay fixed."},{"term":"Retrieval","def":"Fetching text the model does not already have and placing it in the context."},{"term":"Routing","def":"Classifying an input first and sending it to a specialized handler."},{"term":"Step efficiency","def":"The shortest known path compared with the steps actually taken."},{"term":"Stop rule","def":"The condition that ends an agent loop, such as done or a maximum number of steps."},{"term":"Task success","def":"Whether a run reached the right outcome."},{"term":"Token","def":"A small piece of text, about a few characters, that models read and write."},{"term":"Tool","def":"A function the model can ask your code to run."},{"term":"Trace","def":"A recorded trajectory you can read later."},{"term":"Trajectory","def":"The full record of what an agent did: each thought, tool call and result."},{"term":"Workflow","def":"A system where models and tools follow paths your code defines."}],"cheat":{"levels":[["Single prompt","One call, one answer."],["Workflow","Your code sets the steps."],["Agent","The model chooses the steps in a loop."]],"patterns":[["Prompt chaining","Fixed steps, each using the last output, with an optional gate."],["Routing","Classify first, then send to a specialist."],["Parallelization","Run calls together, by sectioning or voting, and combine in code."],["Orchestrator-workers","A central model decides the subtasks at run time."],["Evaluator-optimizer","Generate, critique and improve in a loop, with clear criteria."]],"risk":[["Automatic","Read only, or easy to undo."],["Needs approval","Costly or hard to undo."],["Forbidden","Too much power, or beyond the user's permissions."]],"lint":["The design has a model.","Every write tool sits behind an approval gate.","Step and cost limits are connected to the model.","Any loop has a limit attached to it.","A tracer is connected to the model.","Every retriever has a permission filter feeding it.","Untrusted input passes an input guardrail."],"defenses":[["Loop","Step limit and a repeat check."],["Wrong tool","Narrow tools, and approval for destructive ones."],["Bad arguments","Schema validation with a clear error."],["Runaway cost","Per-run budget, and offload large outputs."],["Double action","Idempotency key."],["Stale context","Re-fetch or expire facts that can change."]]}};</script><script>const LABS = {};
function makeClassifier(cfg) {
  function score(place) {
    const missing = cfg.items.filter(s => !place[s.id]).map(s => s.id);
    const results = cfg.items.filter(s => place[s.id]).map(s => ({ id: s.id, ok: place[s.id] === s.answer, expected: s.answer, chosen: place[s.id], why: s.why, cost: place[s.id] === s.answer ? '' : (cfg.cost ? cfg.cost(s, place[s.id]) : '') }));
    return { total: cfg.items.length, correct: results.filter(r => r.ok).length, missing, results, complete: missing.length === 0 };
  }
  const label = id => (cfg.options.find(o => o.id === id) || {}).label || id;
  function mount(root, journal, cid) {
    const place = Object.assign({}, journal.get(cid) || {}); let checked = false;
    const status = h('p', { class: 'status', role: 'status' }); const list = h('ul', { class: 'cards' }); const extra = h('div', {});
    const check = h('button', { class: 'btn primary', type: 'button' }, 'Check my answers');
    const count = () => cfg.items.filter(s => place[s.id]).length;
    function upd() { check.setAttribute('aria-disabled', String(count() < cfg.items.length || checked)); if (!checked) status.textContent = 'Answered ' + count() + ' of ' + cfg.items.length + '.'; }
    function render() {
      list.replaceChildren(); const sc = checked ? score(place) : null;
      cfg.items.forEach(s => {
